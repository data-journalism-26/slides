# Your readers are not statisticians

.pull-left-wide2[

## The core tension

You work hard to get the numbers right — but does your audience get them?

Data journalism often assumes a **numerically literate reader**. That assumption is likely wrong.


## What's at stake

- Misread statistics → misformed opinions on policy, health, elections
- Misleading visuals → distorted perception of risk or scale
- Overconfident forecasts → eroded trust in media and science


This session is about the **empirical evidence** on what people actually understand in terms of data and visuals - and what that can mean for how we communicate data in journalism.

]

# How numerate is the public?

.pull-left-small[
&lt;div align="center"&gt;
&lt;img src="pics/oecd-numeracy-economist.jpg" style="width:60%; height:auto;"&gt;
&lt;/div&gt;
`Source` [The Economist, Dec 2024](https://www.economist.com/finance-and-economics/2024/12/10/are-adults-forgetting-how-to-read)
]

.pull-right-wide[

## OECD Programme for the International Assessment of Adult Competencies (PIAAC)

- ~160,000 adults across 33 countries tested on literacy, numeracy, problem-solving
- **~50% of adults in OECD countries score at or below Level 2** (out of 5) on numeracy
- Level 2 = can handle simple arithmetic with whole numbers; struggles with percentages, fractions, probability

## What this means for our audience

- Percentages and ratios already challenge many readers
- "1 in 100,000" vs "0.001%" — same, but not perceived as same
- Denominator neglect: absolute numbers feel bigger than rates
]

# Communicating uncertainty

.pull-left[
## The difficulty of communicating uncertainty

- The concept is complex. Not all people think in probabilistic terms.
- Many humans are bad at understanding (conditional and unconditional) probabilities.
- Adding information about uncertainty might distract, confuse, and undermine trust.

# Takeaways: implications for data journalism practice

.pull-left[
## Communicating numbers and visuals

**Most readers struggle with percentages and ratios** — don't take anything stats-related for granted ([Cokely et al. 2012](https://www.cambridge.org/core/journals/judgment-and-decision-making/article/measuring-risk-literacy-the-berlin-numeracy-test/A9B26516D12D48EFA4BD3560E2001E8E))

**Win probability ≠ vote share** — readers systematically confuse the two, inflating perceived certainty and distorting the meaning of probabilistic forecasts ([Westwood et al. 2020](https://doi.org/10.1086/708682))

**Charts can boost credibility — but modestly** — adding data visualizations increases perceived persuasiveness and source credibility, yet effects are small and depend on prior beliefs ([Link et al. 2021](https://doi.org/10.1177/20531680211022616); [Yang et al. 2023](https://doi.org/10.1093/pnasnexus/pgad287))
]

.pull-right[
## Communicating uncertainty

**Reporting uncertainty does not erode trust** — contrary to common editorial instinct, acknowledging data uncertainty leaves public trust in statements largely intact ([van der Bles et al. 2020](https://doi.org/10.1073/pnas.1913678117))

**Uncertainty has multiple levels** — source, measurement, model, and scientific consensus; conflating them misleads audiences ([van der Bles et al. 2019](http://doi.org/10.1098/rsos.181870))

**Suppressing uncertainty is itself a form of misinformation** — and one with a credibility cost when forecasts fail, as 2016 illustrated
]
